openapi: 3.0.3
info:
  title: Meridian mock email API
  version: 1.0.0
  description: Synthetic inbox and outbound store for the Meridian desk demo.
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/messages:
    get:
      operationId: listMessages
      parameters:
        - in: query
          name: direction
          schema:
            type: string
            enum: [inbound, outbound]
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
    post:
      operationId: createMessage
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
        - in: header
          name: X-Fault
          schema:
            type: string
            enum: ['429', '500', '500-once', timeout]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Injected rate limit
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Injected failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/messages/{id}:
    get:
      operationId: getMessage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [ok, service]
      properties:
        ok:
          type: boolean
        service:
          type: string
    Message:
      type: object
      additionalProperties: false
      required: [id, direction, from, to, subject, body, clientKey, createdAt]
      properties:
        id:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        from:
          type: string
        to:
          type: string
        subject:
          type: string
        body:
          type: string
        clientKey:
          type: string
          nullable: true
        createdAt:
          type: string
    MessageList:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    MessageCreate:
      type: object
      additionalProperties: false
      required: [direction, from, to, subject, body]
      properties:
        direction:
          type: string
          enum: [inbound, outbound]
        from:
          type: string
        to:
          type: string
        subject:
          type: string
        body:
          type: string
        clientKey:
          type: string
          nullable: true
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
